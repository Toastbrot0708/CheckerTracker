<body>

<!--
  CheckerTracker — Security visibility for authorized environments.

  Two halves. This page is the console: inventory, analysis, scoring and
  reports, all computed on the device. The scanner service in server/ is the
  sensor: it performs the real network probes a browser cannot.

  Without the service the console still runs, and says so plainly — the
  offline tools (certificate parsing, DNS, header analysis, CIDR maths,
  hashing) are real either way. It never substitutes invented data.

  Each script below is one module on the global `CT` namespace, loaded in
  dependency order as a classic script. See docs/ARCHITECTURE.md.

  SAFETY BOUNDARY: read-only observation and analysis only. No exploitation,
  credential capture, authentication bypass, persistence or evasion
  capability of any kind. See SECURITY.md.
-->

<div id="ct-root" class="app-shell">
  <header id="ct-appbar"></header>
  <main id="ct-view" tabindex="-1"></main>
  <nav id="ct-tabbar" aria-label="Primary"></nav>
</div>
<div id="ct-overlay-root"></div>
<div id="ct-sheet-root"></div>
<div id="ct-toast-root" aria-live="polite" aria-atomic="false"></div>

<!-- Foundation -->

<script src="src/03-dom.js"></script>
<script src="src/04-crypto.js"></script>
<script src="src/05-net.js"></script>

<!-- Reference data and the scanner service client -->
<script src="src/06-data.js"></script>
<script src="src/07-live.js"></script>

<!-- Analysis engines -->
<script src="src/08-engine-capabilities.js"></script>
<script src="src/09-engine-tls.js"></script>
<script src="src/10-engine-web.js"></script>
<script src="src/11-engine-analyzer.js"></script>
<script src="src/12-engine-risk.js"></script>
<script src="src/13-engine-assetdb.js"></script>
<script src="src/14-engine-dns.js"></script>
<script src="src/15-engine-report.js"></script>
